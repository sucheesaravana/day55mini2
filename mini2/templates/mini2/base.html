<!DOCTYPE html>
<html>
<head>
    <title>Personal Finance Tracker</title>

    <style>

        body{
            font-family: Arial;
            margin: 40px;
            background: #f4f4f4;
        }

        .container{
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td{
            border: 1px solid gray;
            padding: 10px;
        }

        a{
            text-decoration: none;
            padding: 8px;
            background: blue;
            color: white;
            border-radius: 5px;
        }

        .income{
            color: green;
        }

        .expense{
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Personal Finance Tracker</h1>

    <hr>

    <a href="{% url 'dashboard' %}">Dashboard</a>

    <a href="{% url 'transaction_list' %}">
        Transactions
    </a>

    <a href="{% url 'transaction_create' %}">
        Add Transaction
    </a>

    <hr>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
